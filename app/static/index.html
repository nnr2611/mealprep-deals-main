<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MealPrep Deals</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--card:#fff;--line:#e3e3dc;--accent:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eee;--card:#212120;--line:#3a3a36;--accent:#5bbf85}}
body{font:16px/1.5 system-ui;background:var(--bg);color:var(--fg);max-width:820px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0}
input,textarea,button{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{background:var(--accent);color:#fff;border:0;cursor:pointer}label{display:block;margin:8px 0 2px;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:120px}pre{white-space:pre-wrap}
</style></head><body>
<h1>MealPrep Deals</h1>
<section><h2>1. Recipe books</h2><div id="books">Loading…</div>
<form id="up"><label>Title</label><input name="title" required>
<label>File (PDF, .txt or .md)</label><input type="file" name="file" accept=".pdf,.txt,.md" required>
<p><button>Upload &amp; index</button> <span id="upmsg"></span></p></form></section>
<section><h2>2. Plan my week</h2>
<div class="row"><div><label>Postal code</label><input id="pc" placeholder="M5V 2T6"></div>
<div><label>People</label><input id="people" type="number" value="1" min="1"></div>
<div><label>kcal / day</label><input id="kcal" type="number" value="1800"></div>
<div><label>Protein g / day</label><input id="prot" type="number" value="100"></div></div>
<label>Notes (allergies, dislikes)</label><textarea id="notes" rows="2" style="width:100%"></textarea>
<p><button id="go">Find deals &amp; build plan</button> <span id="msg"></span></p></section>
<section id="out" hidden></section>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(u,o){const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw new Error(j.detail||r.statusText);return j}
async function loadBooks(){const j=await api('/api/books');$('books').textContent=`${j.books.length} book(s), ${j.recipes.length} recipe(s) indexed.`}
$('up').onsubmit=async e=>{e.preventDefault();$('upmsg').textContent='Reading book… (can take a minute)';
 try{const j=await api('/api/books',{method:'POST',body:new FormData(e.target)});$('upmsg').textContent=`Found ${j.recipes} recipes.`;loadBooks()}catch(x){$('upmsg').textContent=x.message}};
$('go').onclick=async()=>{$('msg').textContent='Working…';$('out').hidden=true;
 try{const pc=$('pc').value;const d=await api('/api/deals?postal_code='+encodeURIComponent(pc));
 const p=await api('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postal_code:pc,people:+$('people').value,calories_per_day:+$('kcal').value,protein_g_per_day:+$('prot').value,notes:$('notes').value})});
 $('out').innerHTML=`<h2>Best stores</h2><table><tr><th>Store</th><th>Best prices</th><th>Avg discount</th></tr>${d.stores.map(s=>`<tr><td>${esc(s.store)}</td><td>${s.best_prices}</td><td>${s.avg_discount_pct}%</td></tr>`).join('')}</table>
 <h2>Plan</h2><p>${esc(p.summary)}</p><p><b>Est. cost:</b> $${p.totals.estimated_cost_cad} CAD · <b>Avg:</b> ${p.totals.avg_kcal_per_person_per_day} kcal/person/day (target ${p.totals.target_kcal})</p>
 <table><tr><th>Day</th><th>Meal</th><th>Recipe</th><th>Servings</th></tr>${p.meals.map(m=>`<tr><td>${esc(m.day)}</td><td>${esc(m.meal)}</td><td>${esc(m.name)}</td><td>${m.servings}</td></tr>`).join('')}</table>
 <h2>Shopping list</h2><ul>${p.shopping_list.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h2>Prep day</h2><ol>${p.prep_schedule.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`;
 $('out').hidden=false;$('msg').textContent=''}catch(x){$('msg').textContent=x.message}};
loadBooks();
</script></body></html>
